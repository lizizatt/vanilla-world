[package]
name = "flats-racer-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Standalone browser adapter for the local racer, not the stock client"

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
flats-racer-physics = { path = "../flats-racer-physics" }
benilla-formats = { path = "../benilla-formats", default-features = false }
wasm-bindgen = "=0.2.122"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
sha2 = "0.10"
