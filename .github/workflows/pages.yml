name: Deploy browser racer to Pages

on:
  push:
    branches: [main]
    paths: ['browser/**', 'client/crates/**', '.github/workflows/pages.yml', 'deploy.env']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen*
          key: wasm-bindgen-0.2.122-${{ runner.os }}-rust-1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Wasm package
        working-directory: client
        run: |
          command -v wasm-bindgen >/dev/null && wasm-bindgen --version | grep -q 0.2.122 || cargo install wasm-bindgen-cli --version 0.2.122 --locked
          cargo build -p flats-racer-web --target wasm32-unknown-unknown --release
          wasm-bindgen target/wasm32-unknown-unknown/release/flats_racer_web.wasm --target web --out-dir ../browser/pkg
      - name: Test
        run: node --test browser
      - name: Build dist (levers from deploy.env)
        run: |
          grep -E '^[A-Z_]+=' deploy.env >> "$GITHUB_ENV"
          INCLUDE_NPC_PACK=1 node browser/build-dist.mjs dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
